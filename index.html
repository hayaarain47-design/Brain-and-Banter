<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Brain & Banter | Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background">

        <div class="shape shape-one"></div>
        <div class="shape shape-two"></div>
        <div class="shape shape-three"></div>

        <div class="floating-symbol symbol-one">+</div>
        <div class="floating-symbol symbol-two">π</div>
        <div class="floating-symbol symbol-three">∑</div>
        <div class="floating-symbol symbol-four">∫</div>
        <div class="floating-symbol symbol-five">⚛</div>
        <div class="floating-symbol symbol-six">DNA</div>

    </div>


    <main class="login-container">

        <section class="login-card">

            <div class="logo-area">

                <div class="logo">
                    B<span>&</span>B
                </div>

                <h1>Brain & Banter</h1>

                <p class="tagline">
                    Think. Play. Discover.
                </p>

            </div>


            <div class="welcome">

                <h2>Welcome Back</h2>

                <p>
                    Enter your details to access the portal.
                </p>

            </div>


            <form id="loginForm">

                <div class="input-group">

                    <label for="username">
                        Username
                    </label>

                    <div class="input-box">

                        <span class="input-icon">◉</span>

                        <input
                            type="text"
                            id="username"
                            placeholder="Enter your name"
                            autocomplete="off"
                            required
                        >

                    </div>

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-box">

                        <span class="input-icon">◆</span>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="togglePassword"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <p id="loginMessage" class="login-message"></p>


                <button
                    type="submit"
                    class="login-button"
                >
                    <span>Enter Portal</span>
                    <span class="arrow">→</span>
                </button>

            </form>


            <div class="portal-info">

                <span></span>

                <p>
                    A place for curious minds
                </p>

                <span></span>

            </div>


            <footer>
                Brain & Banter • Quiz Portal
            </footer>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
