<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Brain & Banter | Result</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="result-body">


    <!-- TOP BAR -->

    <header class="result-topbar">


        <div class="result-brand">

            <div class="mini-logo">
                B<span>&</span>B
            </div>


            <div>

                <strong>
                    Brain & Banter
                </strong>

                <small>
                    Quiz Portal
                </small>

            </div>

        </div>


        <button
            id="resultLogout"
            class="logout-button"
        >
            Logout
        </button>

    </header>



    <!-- RESULT -->

    <main class="result-main">


        <!-- MAIN RESULT CARD -->

        <section class="result-card">


            <div class="result-check">
                ✓
            </div>


            <p class="eyebrow">
                QUIZ COMPLETED
            </p>


            <h1>

                Well Done,
                <span id="resultUser">
                    Explorer
                </span>

            </h1>


            <p class="result-subtitle">

                You completed the

                <strong id="resultSubject">
                    Quiz
                </strong>

                challenge.

            </p>



            <!-- SCORE -->

            <div class="score-circle">

                <div>

                    <strong id="score">
                        0
                    </strong>

                    <span>
                        /
                        <span id="total">
                            10
                        </span>
                    </span>

                </div>

            </div>


            <p class="score-label">
                Your Score
            </p>



            <!-- PERCENTAGE -->

            <div class="percentage-box">


                <div class="percentage-heading">

                    <span>
                        Overall Performance
                    </span>


                    <strong id="percentage">
                        0%
                    </strong>

                </div>


                <div class="percentage-bar">

                    <div
                        id="percentageFill"
                        class="percentage-fill"
                    ></div>

                </div>


            </div>



            <!-- MESSAGE -->

            <div
                id="performanceMessage"
                class="performance-message"
            >

                Keep learning and keep challenging yourself.

            </div>



            <!-- BUTTONS -->

            <div class="result-buttons">


                <button
                    id="retryQuiz"
                    class="primary-result-button"
                >
                    Try Again
                </button>


                <button
                    id="resultDashboard"
                    class="secondary-result-button"
                >
                    Dashboard
                </button>


            </div>


        </section>



        <!-- DETAILS -->

        <section class="result-details">


            <div class="detail-box">

                <span class="detail-number">

                    <span id="correctAnswers">
                        0
                    </span>

                </span>


                <strong>
                    Correct
                </strong>


                <small>
                    Answers
                </small>

            </div>



            <div class="detail-box">

                <span class="detail-number">

                    <span id="wrongAnswers">
                        0
                    </span>

                </span>


                <strong>
                    Incorrect
                </strong>


                <small>
                    Answers
                </small>

            </div>



            <div class="detail-box">

                <span class="detail-number">

                    <span id="attemptedAnswers">
                        0
                    </span>

                </span>


                <strong>
                    Attempted
                </strong>


                <small>
                    Questions
                </small>

            </div>


        </section>


    </main>



    <!-- FOOTER -->

    <footer class="result-footer">

        Brain & Banter

        <span>
            •
        </span>

        Learn. Challenge. Improve.

    </footer>



    <script src="script.js"></script>

</body>

</html>
