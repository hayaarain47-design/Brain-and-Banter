<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Brain & Banter | Quiz</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="quiz-body">


    <!-- TOP BAR -->

    <header class="quiz-topbar">

        <button
            id="backToDashboard"
            class="back-button"
        >
            ← Dashboard
        </button>


        <div class="quiz-brand">

            <div class="mini-logo">
                B<span>&</span>B
            </div>

            <span>
                Brain & Banter
            </span>

        </div>


        <button
            id="exitQuiz"
            class="back-button"
        >
            Exit Quiz
        </button>

    </header>



    <!-- MAIN QUIZ -->

    <main class="quiz-main">


        <!-- QUIZ HEADER -->

        <section class="quiz-header">

            <div>

                <p class="eyebrow">
                    KNOWLEDGE CHALLENGE
                </p>

                <h1 id="quizSubject">
                    Quiz
                </h1>

                <p>
                    Select the best answer for each question.
                </p>

            </div>


            <div class="timer-box">

                <span class="timer-label">
                    TIME LEFT
                </span>

                <strong id="timer">
                    05:00
                </strong>

            </div>

        </section>



        <!-- PROGRESS -->

        <section class="progress-section">

            <div class="progress-info">

                <span>

                    Question

                    <strong id="currentQuestion">
                        1
                    </strong>

                    of

                    <strong id="totalQuestions">
                        10
                    </strong>

                </span>


                <span id="progressPercent">
                    10%
                </span>

            </div>


            <div class="progress-bar">

                <div
                    id="progressFill"
                    class="progress-fill"
                ></div>

            </div>

        </section>



        <!-- QUESTION CARD -->

        <section class="question-card">


            <div
                id="questionNumber"
                class="question-number"
            >
                01
            </div>


            <h2 id="questionText">
                Loading question...
            </h2>


            <!-- OPTIONS -->

            <div
                id="optionsContainer"
                class="options-container"
            >
            </div>



            <!-- NAVIGATION -->

            <div class="quiz-navigation">

                <button
                    id="previousButton"
                    class="previous-button"
                    disabled
                >
                    ← Previous
                </button>


                <button
                    id="nextButton"
                    class="next-button"
                >
                    Next →
                </button>

            </div>


        </section>


    </main>



    <!-- FOOTER -->

    <footer class="quiz-footer">

        Brain & Banter

        <span>
            •
        </span>

        Learn. Challenge. Improve.

    </footer>



    <script src="script.js"></script>

</body>

</html>
