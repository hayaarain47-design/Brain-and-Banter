<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Brain & Banter | Leaderboard</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="dashboard-body">

    <header class="topbar">

        <div class="brand-small">

            <div class="mini-logo">
                B<span>&</span>B
            </div>

            <div>
                <strong>Brain & Banter</strong>
                <small>Quiz Portal</small>
            </div>

        </div>


        <button
            id="logoutButton"
            class="logout-button"
        >
            Logout
        </button>

    </header>



    <main class="dashboard-main">

        <section class="welcome-banner">

            <div>

                <p class="eyebrow">
                    QUIZ COMMUNITY
                </p>

                <h1>
                    Leaderboard
                </h1>

                <p class="welcome-text">
                    See how you and your friends performed.
                    Keep learning, keep challenging yourself.
                </p>

            </div>


            <div class="dashboard-icon">
                #
            </div>

        </section>



        <div class="section-heading">

            <div>
                <p class="eyebrow">
                    TOP PERFORMERS
                </p>

                <h2>
                    Quiz Results
                </h2>
            </div>

            <p>
                Your latest performance
            </p>

        </div>



        <section
            id="leaderboardContainer"
            class="leaderboard-container"
        >

            <div class="leaderboard-header">

                <span>Rank</span>

                <span>Name</span>

                <span>Score</span>

                <span>Percentage</span>

            </div>


            <div id="leaderboardList">

                <!-- Results will appear here -->

            </div>

        </section>


    </main>



    <footer class="dashboard-footer">

        Brain & Banter
        <span>•</span>
        Learn. Challenge. Improve.

    </footer>


    <script src="script.js"></script>

</body>

</html>
